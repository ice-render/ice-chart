<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>ice-chart · 行情监控大屏</title>
    <!--
      第三个大屏案例：行情 / 交易监控。同一套脚手架（examples/assets/dash-kit.js）与 12 列栅格，
      换「深黑底 + 琥珀主色 + 涨跌红绿」的视觉身份，主图改成 K 线 + 分时并排。
    -->
    <style>
      /* 视觉身份：深黑 + 琥珀（涨跌另用红绿） */
      :root {
        --dk-bg: #08070a;
        --dk-bg-2: #131017;
        --dk-panel: rgba(38, 27, 20, 0.5);
        --dk-panel-2: rgba(18, 14, 16, 0.88);
        --dk-line: rgba(245, 165, 36, 0.16);
        --dk-corner: rgba(245, 165, 36, 0.7);
        --dk-accent: #f5a524;
        --dk-accent-soft: rgba(245, 165, 36, 0.08);
        --dk-accent-soft-strong: rgba(245, 165, 36, 0.32);
        --dk-text: #f4ece1;
        --dk-text-dim: #b3a394;
        --dk-muted: #877764;
        --dk-ok: #12b76a;
        --dk-danger: #f04438;
        --dk-glow: rgba(245, 165, 36, 0.09);
        --dk-glow-2: rgba(240, 68, 56, 0.07);
        --dk-glow-text: rgba(245, 165, 36, 0.4);
        --dk-dots: rgba(245, 165, 36, 0.07);
      }
    </style>
  </head>
  <body>
    <div class="dk-screen" id="screen"></div>

    <script src="./vendor/ice-render.umd.js"></script>
    <script src="./vendor/ice-chart.umd.js"></script>
    <script src="./assets/snapshot-panel.js"></script>
    <script src="./assets/dash-kit.js"></script>
    <script>
      DashKit.injectStyle();
      const $ = (id) => document.getElementById(id);
      const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
      const WINDOW = 180;
      const UP = '#f04438'; // 国内习惯：红涨
      const DOWN = '#12b76a'; // 绿跌

      const IDENTITY = {
        accent: '#f5a524',
        palette: ['#f5a524', '#f04438', '#12b76a', '#fdb022', '#ee46bc', '#7a5af8', '#36bffa', '#f97066', '#84cc16', '#94a3b8'],
        text: '#f4ece1',
        textDim: '#b3a394',
        axisLine: 'rgba(245, 165, 36, 0.16)',
        axisLabel: '#a3937f',
        splitLine: 'rgba(245, 165, 36, 0.08)',
        halo: 'rgba(8, 7, 10, 0.9)',
        inactive: '#584c3d',
        tooltipBg: 'rgba(20, 15, 14, 0.96)',
        tooltipBorder: 'rgba(245, 165, 36, 0.32)',
        crosshair: 'rgba(245, 165, 36, 0.5)',
        chipBg: 'rgba(16, 12, 10, 0.95)',
        chipText: '#ffd28a',
        brushFill: 'rgba(245, 165, 36, 0.12)',
        brushStroke: 'rgba(245, 165, 36, 0.8)',
      };
      const theme = DashKit.chartTheme(IDENTITY);
      const BASE = {
        theme,
        legend: { show: false },
        tooltip: { trigger: 'axis' },
        crosshair: { show: true, axis: 'x', showAxisLabel: true },
        animation: { enter: { duration: 600, easing: 'easeOutCubic' } },
        xAxis: { type: 'value' },
        yAxis: {},
      };

      $('screen').innerHTML =
        '<header class="dk-topbar">' +
        '<span class="dk-wing left"></span><h1>行情监控大屏</h1><span class="dk-wing right"></span>' +
        '<div class="dk-side left"><span class="dk-pill ok"><i class="dk-dot"></i>行情正常</span>' +
        '<span class="dk-pill" id="pill-clock">--:--:--</span>' +
        '<span class="dk-pill">最新 <b id="pill-last">--</b></span></div>' +
        '<div class="dk-side right"><span class="dk-pill" id="pill-risk">风险 0</span>' +
        '<button class="dk-ghost" id="btn-spike">放量拉升</button>' +
        '<button class="dk-ghost" id="btn-toggle">暂停</button></div>' +
        '</header>' +
        DashKit.kpiStrip([
          { id: 'kpi-last', label: '最新价', unit: '元' },
          { id: 'kpi-change', label: '涨跌幅', unit: '%' },
          { id: 'kpi-amount', label: '成交额', unit: '亿' },
          { id: 'kpi-turn', label: '换手率', unit: '%' },
          { id: 'kpi-north', label: '北向净流入', unit: '亿' },
        ]) +
        DashKit.panel({ id: 'trend', title: '分时走势', meta: '滑动窗口 60Hz', span: 6, height: 200 }) +
        DashKit.panel({ id: 'kline', title: '实时 K 线', meta: '每 8 个采样一根 · 最后一根跳动', span: 6, height: 200 }) +
        DashKit.panel({ id: 'depth', title: '盘口五档', meta: '买盘 / 卖盘', span: 3, height: 170 }) +
        DashKit.panel({ id: 'moneyflow', title: '资金流向', meta: '主力 / 散户', span: 6, height: 170 }) +
        DashKit.panel({ id: 'turnover', title: '换手率', meta: '水位球', span: 3, height: 170 }) +
        DashKit.panel({ id: 'sector', title: '板块热力', meta: '矩形 morph', span: 4, height: 170 }) +
        DashKit.panel({ id: 'dist', title: '涨跌分布', meta: '涨跌家数', span: 4, height: 170 }) +
        DashKit.panel({ id: 'rating', title: '板块评分', meta: '实时抖动', span: 4, height: 170 }) +
        // 玫瑰图是「方」的图形：放在 762px 宽的卡片里，圆只占 14% 宽、两边全是死区。
        // 窄卡片（366）里圆占 40% 且纵向吃满 —— 形状匹配比"面板更宽"重要。
        DashKit.panel({ id: 'orders', title: '大单成交', meta: '按金额着色', span: 9, height: 170 }) +
        DashKit.panel({ id: 'industry', title: '行业占比', meta: '玫瑰图', span: 3, height: 170 }) +
        '<div class="dk-footer"><span>ice-chart · 交互全部由引擎内建</span>' +
        '<span>同一套 12 列栅格与组件：换配色即另一个大屏</span></div>' +
        '<div id="snapshot-panel"></div>';

      // ---------------- 数据源 ----------------
      const state = {
        t: 0,
        price: 42.8,
        prevClose: 42.15,
        amount: 0,
        turn: 3.2,
        north: 12,
        spike: 0,
      };
      const change = () => ((state.price - state.prevClose) / state.prevClose) * 100;

      // ---------------- 面板 ----------------
      const trend = ICEChart.createChart('trend', {
        ...BASE,
        yAxis: { name: '价格', min: 38, max: 48 },
        series: [
          { id: 'price', type: 'area', name: '价格', data: [], color: '#f5a524', areaOpacity: 0.22, lineWidth: 2, smooth: 0.2 },
          { id: 'avg', type: 'line', name: '均价', data: [], color: '#36bffa', lineWidth: 1.5, smooth: 0.3 },
        ],
      });

      const candles = [];
      let building = null;
      const candleData = () => candles.map((c) => [c.o, c.c, c.l, c.h]);
      const kline = ICEChart.createChart('kline', {
        ...BASE,
        tooltip: { trigger: 'item' },
        xAxis: { type: 'category' },
        yAxis: { name: '价格', min: 38, max: 48 },
        animation: { enter: { duration: 400 }, update: { duration: 180, easing: 'linear' } },
        series: [
          {
            id: 'k',
            type: 'candlestick',
            name: '价格',
            data: [],
            barWidth: 0.5,
            candle: { upColor: UP, downColor: DOWN, borderWidth: 1 },
          },
        ],
      });

      // 只放 6 档：面板高 170px，10 档的类目标签会叠字（每档只剩 13px）
      const depthLabels = ['卖三', '卖二', '卖一', '买一', '买二', '买三'];
      const depth = ICEChart.createChart('depth', {
        ...BASE,
        tooltip: { trigger: 'item' },
        xAxis: { type: 'value', name: '手' },
        yAxis: { type: 'category', data: depthLabels },
        grid: { x: true, y: false },
        animation: { enter: { duration: 400 }, update: { duration: 200, easing: 'linear' } },
        series: [
          {
            id: 'dp',
            type: 'bar',
            name: '挂单',
            barWidth: 0.5,
            // 逐项配色：卖盘绿、买盘红（与 K 线同色系，国内习惯）
            data: [
              { value: 820, color: DOWN }, { value: 640, color: DOWN }, { value: 1500, color: DOWN },
              { value: 1180, color: UP }, { value: 1560, color: UP }, { value: 920, color: UP },
            ],
          },
        ],
      });

      const moneyflow = ICEChart.createChart('moneyflow', {
        ...BASE,
        tooltip: { trigger: 'item' },
        sankey: {
          nodes: [
            { name: '主力' },
            { name: '游资' },
            { name: '散户' },
            { name: '科技' },
            { name: '消费' },
            { name: '医药' },
            { name: '流出' },
          ],
          links: [
            { source: '主力', target: '科技', value: 420 },
            { source: '主力', target: '消费', value: 260 },
            { source: '游资', target: '科技', value: 300 },
            { source: '游资', target: '医药', value: 180 },
            { source: '散户', target: '医药', value: 240 },
            { source: '散户', target: '流出', value: 320 },
            { source: '科技', target: '流出', value: 180 },
          ],
          nodeWidth: 12,
          nodePadding: 8,
          flow: true,
          flowSpeed: 52,
          linkOpacity: 0.6,
        },
        series: [{ id: 'mf', type: 'sankey', name: '资金' }],
      });

      const turnover = ICEChart.createChart('turnover', {
        ...BASE,
        tooltip: { trigger: 'item' },
        liquid: { min: 0, max: 20, color: '#f5a524', borderWidth: 4, waveHeight: 0.05, waveLength: 1.4, waveSpeed: 1.5, detail: { fontSize: 30, formatter: (v) => `${v.toFixed(1)}%` } },
        series: [{ id: 'to', type: 'liquid', name: '换手率', data: [{ name: '换手', value: 0 }] }],
      });

      const sectors = [
        { name: '科技', children: [{ name: '半导体', value: 320 }, { name: '软件', value: 220 }, { name: '通信', value: 160 }] },
        { name: '消费', children: [{ name: '白酒', value: 280 }, { name: 'food', value: 140 }] },
        { name: '医药', value: 200 },
      ];
      const sector = ICEChart.createChart('sector', {
        ...BASE,
        tooltip: { trigger: 'item' },
        animation: { enter: { duration: 600 }, update: { duration: 520, easing: 'easeOutCubic' } },
        treemap: { gap: 2, minLabelRatio: 0.06, depthFade: 0.16 },
        series: [{ id: 'sec', type: 'treemap', name: '板块', data: sectors }],
      });

      const dist = ICEChart.createChart('dist', {
        ...BASE,
        tooltip: { trigger: 'item' },
        xAxis: { type: 'category' },
        yAxis: { name: '家数' },
        animation: { enter: { duration: 500 }, update: { duration: 400, easing: 'easeOutCubic' } },
        series: [
          {
            id: 'd',
            type: 'bar',
            name: '涨跌分布',
            data: [
              { value: 180, color: '#f04438' },
              { value: 320, color: '#f97066' },
              { value: 260, color: '#fdb022' },
              { value: 210, color: '#84cc16' },
              { value: 150, color: '#12b76a' },
            ],
            barWidth: 0.5,
          },
        ],
      });

      const rating = ICEChart.createChart('rating', {
        ...BASE,
        radar: {
          indicators: [
            { name: '资金', max: 100 },
            { name: '情绪', max: 100 },
            { name: '估值', max: 100 },
            { name: '成长', max: 100 },
            { name: '风险', max: 100 },
          ],
          splitNumber: 4,
        },
        animation: { enter: { duration: 600 }, update: { duration: 300, easing: 'linear' } },
        series: [
          { id: 'sz', type: 'radar', name: '科技', data: [86, 74, 62, 88, 54], color: '#f5a524' },
          { id: 'sh', type: 'radar', name: '消费', data: [68, 58, 84, 60, 72], color: '#36bffa' },
        ],
      });

      const orders = [];
      const ordersChart = ICEChart.createChart('orders', {
        ...BASE,
        tooltip: { trigger: 'item' },
        xAxis: { type: 'value', name: '时间' },
        yAxis: { name: '金额(万)', min: 0, max: 4000 },
        series: [{ id: 'od', type: 'scatter', name: '大单', data: [], symbolSize: 11, color: '#f5a524' }],
      });

      const industryData = [
        { name: '科技', value: 32 },
        { name: '消费', value: 24 },
        { name: '医药', value: 16 },
        { name: '金融', value: 14 },
        { name: '能源', value: 9 },
        { name: '其它', value: 5 },
      ];
      const industry = ICEChart.createChart('industry', {
        ...BASE,
        tooltip: { trigger: 'item' },
        series: [{ id: 'ind', type: 'pie', name: '行业', data: industryData, roseType: 'area', innerRadius: 0.34, label: { show: false } }],
      });

      // ---------------- 主循环 ----------------
      const updateKpi = DashKit.kpiUpdater();
      const loop = DashKit.loop({
        tick: () => {
          state.t += 1;
          const t = state.t;
          if (state.spike > 0) {
            state.spike -= 1;
            state.price = clamp(state.price + 0.035 + Math.random() * 0.03, 38, 48);
          } else {
            state.price = clamp(DashKit.walk(state.price, 42.8 + Math.sin(t / 120) * 1.6, 0.06, 0.03), 38, 48);
          }
          state.amount = clamp(state.amount + 0.02 + Math.random() * 0.05, 0, 999);
          state.turn = clamp(DashKit.walk(state.turn, 3.2, 0.06), 0.5, 18);
          state.north = DashKit.walk(state.north, 12, 0.8);

          trend.appendData('price', [[t, Number(state.price.toFixed(2))]], { maxPoints: WINDOW });
          trend.appendData('avg', [[t, Number((state.price * 0.995 + 0.2).toFixed(2))]], { maxPoints: WINDOW });

          // K 线：每 8 个采样一根
          if (!building) building = { o: state.price, c: state.price, l: state.price, h: state.price };
          building.c = state.price;
          building.h = Math.max(building.h, state.price);
          building.l = Math.min(building.l, state.price);
          if (t % 8 === 0) {
            candles.push({ ...building });
            if (candles.length > 34) candles.shift();
            building = null;
            kline.setData('k', candleData());
          } else {
            kline.setData('k', candleData().concat([[building.o, building.c, building.l, building.h]]));
          }

          if (t % 8 === 0) turnover.setData('to', [{ name: '换手', value: Number(state.turn.toFixed(2)) }]);
          if (t % 20 === 0) {
            depth.setData('dp', depthLabels.map((_, i) => ({ value: Math.round(600 + Math.random() * 1200), color: i < 5 ? DOWN : UP })));
          }
          if (t % 40 === 0) {
            rating.setData('sz', [clamp(86 + (Math.random() - 0.5) * 8, 30, 100), clamp(74 + (Math.random() - 0.5) * 10, 30, 100), clamp(62 + (Math.random() - 0.5) * 8, 30, 100), clamp(88 + (Math.random() - 0.5) * 6, 30, 100), clamp(54 + (Math.random() - 0.5) * 10, 20, 100)]);
            rating.setData('sh', [clamp(68 + (Math.random() - 0.5) * 8, 30, 100), clamp(58 + (Math.random() - 0.5) * 10, 30, 100), clamp(84 + (Math.random() - 0.5) * 6, 30, 100), clamp(60 + (Math.random() - 0.5) * 8, 30, 100), clamp(72 + (Math.random() - 0.5) * 8, 30, 100)]);
          }
          if (t % 90 === 0) {
            sector.setData(
              'sec',
              sectors.map((node) => (node.children
                ? { ...node, children: node.children.map((c) => ({ ...c, value: Math.round(c.value * (0.8 + Math.random() * 0.4)) })) }
                : { ...node, value: Math.round(node.value * (0.8 + Math.random() * 0.4)) }))
            );
            industry.setData('ind', industryData.map((d) => ({ ...d, value: Math.round(d.value * (0.85 + Math.random() * 0.3)) })));
          }

          // 大单成交：金额越大点越大
          if (Math.random() < 0.25) {
            orders.push([t, Math.round(300 + Math.random() * 3400)]);
            if (orders.length > 60) orders.shift();
            ordersChart.setData('od', orders);
          }

          const chg = change();
          $('pill-last').textContent = state.price.toFixed(2);
          const risky = Math.abs(chg) > 6;
          $('pill-risk').textContent = risky ? '波动异常' : '风险 0';
          $('pill-risk').className = `dk-pill ${risky ? 'danger' : 'ok'}`;
          ['kline', 'trend'].forEach((id) => {
            const panel = $('panel-' + id);
            if (panel) panel.classList.toggle('dk-alert', risky);
          });

          updateKpi('kpi-last', state.price, `${state.price.toFixed(2)}<small>元</small>`);
          updateKpi('kpi-change', chg, `${chg >= 0 ? '+' : ''}${chg.toFixed(2)}<small>%</small>`, true);
          updateKpi('kpi-amount', state.amount, `${state.amount.toFixed(1)}<small>亿</small>`);
          updateKpi('kpi-turn', state.turn, `${state.turn.toFixed(2)}<small>%</small>`);
          updateKpi('kpi-north', state.north, `${state.north >= 0 ? '+' : ''}${state.north.toFixed(1)}<small>亿</small>`, true);
          const changeEl = document.querySelector('#kpi-change .dk-value');
          if (changeEl) changeEl.style.color = chg >= 0 ? UP : DOWN;
        },
        onFrame: () => {
          $('pill-clock').textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false });
        },
      });

      $('btn-toggle').addEventListener('click', (event) => {
        event.target.textContent = loop.toggle() ? '暂停' : '继续';
      });
      $('btn-spike').addEventListener('click', () => {
        state.spike = 60;
      });

      DashKit.wire({ main: trend, charts: { trend, kline, depth, moneyflow, turnover, sector, dist, rating, orders: ordersChart, industry } });
    </script>
  </body>
</html>
