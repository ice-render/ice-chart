<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>ice-chart · K 线与热力图</title>
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <h1>K 线 / 热力图</h1>
    <p class="lead">
      左侧 K 线：数据项是 <code>[open, close, low, high]</code>，影线（low/high）会一并进入 y 轴数据域；
      命中判定按蜡烛的外接矩形（含影线），提示框给出完整 OHLC。
      右侧热力图：数据项是 <code>[x类目, y类目, 数值]</code>，<b>y 轴自动变成类目轴</b>，颜色按数值线性插值。
    </p>
    <div class="row">
      <div class="card"><canvas id="candle" width="640" height="420"></canvas></div>
      <div class="card"><canvas id="heatmap" width="560" height="420"></canvas></div>
    </div>
    <div class="card"><div class="log" id="log">事件日志：</div></div>
    <script src="./vendor/ice-render.umd.js"></script>
    <script src="./vendor/ice-chart.umd.js"></script>
    <script>
      // ---- K 线：随机游走生成 60 根日 K
      let price = 100;
      const days = [];
      const candles = [];
      for (let i = 0; i < 60; i++) {
        const open = price;
        const close = Math.max(20, open + (Math.random() - 0.48) * 6);
        const high = Math.max(open, close) + Math.random() * 3;
        const low = Math.min(open, close) - Math.random() * 3;
        price = close;
        days.push(`D${i + 1}`);
        candles.push([Number(open.toFixed(2)), Number(close.toFixed(2)), Number(low.toFixed(2)), Number(high.toFixed(2))]);
      }

      const candle = ICEChart.createChart('candle', {
        title: { text: '日 K 线（60 个交易日）' },
        theme: 'light',
        legend: { show: false },
        tooltip: { trigger: 'item' },
        crosshair: { show: true, axis: 'x', showAxisLabel: false },
        xAxis: { type: 'category' },
        yAxis: { name: '价格' },
        dataZoom: { start: 40, end: 100, slider: { height: 22 } },
        series: [
          {
            id: 'k',
            type: 'candlestick',
            name: 'K 线',
            data: candles,
            candle: { upColor: '#EF4444', downColor: '#10B981', borderWidth: 1 },
          },
        ],
      });

      // ---- 热力图：一周 × 六个时段
      const weekdays = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
      const slots = ['凌晨', '上午', '中午', '下午', '傍晚', '深夜'];
      const heat = [];
      for (const day of weekdays) {
        for (const slot of slots) {
          const base = slot === '中午' || slot === '下午' ? 60 : 25;
          const weekend = day === '周六' || day === '周日' ? 18 : 0;
          heat.push([day, slot, Math.round(base + weekend + Math.random() * 30)]);
        }
      }

      const heatmap = ICEChart.createChart('heatmap', {
        title: { text: '一周活跃度热力图' },
        theme: 'light',
        legend: { show: false },
        tooltip: { trigger: 'item' },
        xAxis: { type: 'category' },
        yAxis: { type: 'category' },
        series: [
          {
            id: 'heat',
            type: 'heatmap',
            name: '活跃度',
            data: heat,
            color: '#1D4ED8',
            heatmap: { minColor: '#EFF6FF', maxColor: '#1D4ED8' },
          },
        ],
      });

      const log = document.getElementById('log');
      const write = (line) => {
        log.textContent = `${new Date().toLocaleTimeString()}  ${line}\n` + log.textContent;
      };
      candle.on('item:hover', (p) => {
        const d = p.data;
        if (Array.isArray(d)) write(`K 线 ${p.xValue}  开${d[0]} 收${d[1]} 低${d[2]} 高${d[3]}`);
      });
      heatmap.on('item:hover', (p) => write(`热力图 ${p.data[0]} · ${p.data[1]} = ${p.data[2]}`));
      window.__charts = { candle, heatmap };
    </script>
  </body>
</html>
