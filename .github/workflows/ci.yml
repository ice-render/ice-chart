name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 引擎走 npm 依赖（peer + dev），CI 只装 chart 自己的依赖。
      # 想连引擎源码一起测：把 devDependencies 里那条改成 file:../ice-render，
      # 并把引擎仓库克隆到同级目录。
      - name: 安装依赖
        run: npm ci --no-audit --no-fund
      - name: 全量门禁
        run: npm run verify
