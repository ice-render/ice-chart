<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>ice-chart · 物流调度大屏</title>
    <!--
      第四个大屏案例：仓储 / 配送调度。共用 examples/assets/dash-kit.js，
      只换视觉身份（橙红主色）与面板清单。
      这张屏主打「同一张图在不同数据形态下的用法」：横向柱形用逐项配色表达承运商分级，
      纵向柱形用逐项配色表达时段是否越限 —— 一个系列就能表达分级，不必拆成多系列。
    -->
    <style>
      /* 视觉身份：橙红 */
      :root {
        --dk-bg: #170806;
        --dk-bg-2: #240d08;
        --dk-panel: rgba(66, 24, 14, 0.5);
        --dk-panel-2: rgba(38, 13, 8, 0.86);
        --dk-line: rgba(255, 122, 69, 0.18);
        --dk-corner: rgba(255, 122, 69, 0.72);
        --dk-accent: #ff7a45;
        --dk-accent-soft: rgba(255, 122, 69, 0.09);
        --dk-accent-soft-strong: rgba(255, 122, 69, 0.36);
        --dk-text: #ffeee6;
        --dk-text-dim: #d4a496;
        --dk-muted: #a3715f;
        --dk-glow: rgba(255, 122, 69, 0.1);
        --dk-glow-2: rgba(250, 200, 88, 0.08);
        --dk-glow-text: rgba(255, 122, 69, 0.45);
        --dk-dots: rgba(255, 122, 69, 0.08);
      }
    </style>
  </head>
  <body>
    <div class="dk-screen" id="screen"></div>

    <script src="./vendor/ice-render.umd.js"></script>
    <script src="./vendor/ice-chart.umd.js"></script>
    <script src="./assets/snapshot-panel.js"></script>
    <script src="./assets/dash-kit.js"></script>
    <script>
      DashKit.injectStyle();
      const $ = (id) => document.getElementById(id);
      const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
      const WINDOW = 180;

      const IDENTITY = {
        accent: '#ff7a45',
        palette: ['#ff7a45', '#fac858', '#f472b6', '#2ee6c5', '#38bdf8', '#a3e635', '#fb923c', '#c4b5fd', '#22c55e', '#94a3b8'],
        text: '#ffeee6',
        // 轴名称 / 图例文字用近灰：偏橙的灰（通道极差 > 45）会被「越界墨迹」审计判成饱和色
        textDim: '#c9b3ab',
        axisLine: 'rgba(255, 122, 69, 0.2)',
        axisLabel: '#b0998f',
        splitLine: 'rgba(255, 122, 69, 0.1)',
        halo: 'rgba(23, 8, 6, 0.9)',
        inactive: '#6b4034',
        tooltipBg: 'rgba(38, 13, 8, 0.96)',
        tooltipBorder: 'rgba(255, 122, 69, 0.34)',
        crosshair: 'rgba(255, 122, 69, 0.5)',
        chipBg: 'rgba(30, 10, 7, 0.94)',
        chipText: '#ffb99a',
        brushFill: 'rgba(255, 122, 69, 0.12)',
        brushStroke: 'rgba(255, 122, 69, 0.8)',
      };
      const theme = DashKit.chartTheme(IDENTITY);
      const BASE = {
        theme,
        legend: { show: false },
        tooltip: { trigger: 'axis' },
        crosshair: { show: true, axis: 'x', showAxisLabel: true },
        animation: { enter: { duration: 600, easing: 'easeOutCubic' } },
        xAxis: { type: 'value' },
        yAxis: {},
      };

      // ---------------- 面板清单 ----------------
      $('screen').innerHTML =
        '<header class="dk-topbar">' +
        '<span class="dk-wing left"></span><h1>物流调度大屏</h1><span class="dk-wing right"></span>' +
        '<div class="dk-side left"><span class="dk-pill ok"><i class="dk-dot"></i>分拣线正常</span>' +
        '<span class="dk-pill" id="pill-clock">--:--:--</span>' +
        '<span class="dk-pill">准时率 <b id="pill-ontime">--</b></span></div>' +
        '<div class="dk-side right"><span class="dk-pill" id="pill-alert">积压 0</span>' +
        '<button class="dk-ghost" id="btn-spike">注入积压</button>' +
        '<button class="dk-ghost" id="btn-toggle">暂停</button></div>' +
        '</header>' +
        DashKit.kpiStrip([
          { id: 'kpi-orders', label: '今日订单', unit: '单' },
          { id: 'kpi-transit', label: '在途包裹', unit: '件' },
          { id: 'kpi-ontime', label: '准时率', unit: '%' },
          { id: 'kpi-exception', label: '异常件', unit: '件' },
          { id: 'kpi-hours', label: '平均时效', unit: 'h' },
        ]) +
        DashKit.panel({ id: 'orders', title: '订单吞吐', meta: '滑动窗口 60Hz · 与时效联动', span: 5, height: 200 }) +
        DashKit.panel({ id: 'sla', title: '履约时效', meta: '分钟 · 越低越好', span: 4, height: 200 }) +
        DashKit.panel({ id: 'stage', title: '分拣环节', meta: '漏斗', span: 3, height: 200 }) +
        DashKit.panel({ id: 'pack', title: '在途包裹', meta: '水位球', span: 3, height: 170 }) +
        DashKit.panel({ id: 'warehouse', title: '仓库容量', meta: '矩形 morph', span: 5, height: 170 }) +
        DashKit.panel({ id: 'cost', title: '单票成本构成', meta: '瀑布图', span: 4, height: 170 }) +
        DashKit.panel({ id: 'network', title: '配送网络', meta: '可拖拽节点', span: 4, height: 170 }) +
        DashKit.panel({ id: 'parcel', title: '包裹流向', meta: '仓 → 站 → 户', span: 4, height: 170 }) +
        DashKit.panel({ id: 'spread', title: '时效分布', meta: '箱线图', span: 4, height: 170 }) +
        DashKit.panel({ id: 'carrier', title: '承运商排名', meta: '横向柱 · 逐项配色', span: 4, height: 170 }) +
        DashKit.panel({ id: 'hourly', title: '分时揽收', meta: '越限时段标红', span: 4, height: 170 }) +
        DashKit.panel({ id: 'exception', title: '异常件分布', meta: '按类型着色', span: 4, height: 170 }) +
        '<div class="dk-footer"><span>ice-chart · 交互全部由引擎内建</span>' +
        '<span>同一套 12 列栅格与组件：换配色即另一个大屏</span></div>' +
        '<div id="snapshot-panel"></div>';

      // ---------------- 数据源 ----------------
      const state = { t: 0, orders: 860, hours: 6.4, ontime: 96.5, exception: 42, backlog: 120, pack: 62 };

      // ---------------- 面板 ----------------
      const orders = ICEChart.createChart('orders', {
        ...BASE,
        yAxis: { name: '单/分钟', min: 200, max: 2000 },
        series: [
          { id: 'o', type: 'area', name: '揽收', data: [], color: IDENTITY.accent, areaOpacity: 0.24, lineWidth: 2, smooth: 0.25 },
          { id: 'd', type: 'line', name: '签收', data: [], color: '#fac858', lineWidth: 1.5, smooth: 0.25 },
        ],
      });

      const sla = ICEChart.createChart('sla', {
        ...BASE,
        yAxis: { name: '分钟', min: 20, max: 140 },
        series: [{ id: 's', type: 'area', name: '履约时效', data: [], color: '#2ee6c5', areaOpacity: 0.24, lineWidth: 2, smooth: 0.25 }],
      });
      const link = ICEChart.linkCharts([orders, sla], { axis: 'x', hover: true, zoom: true, brush: true });

      const stageData = [
        { name: '揽收', value: 12800 },
        { name: '分拣', value: 11600 },
        { name: '干线', value: 10400 },
        { name: '派送', value: 9600 },
        { name: '签收', value: 9180 },
      ];
      const stage = ICEChart.createChart('stage', {
        ...BASE,
        tooltip: { trigger: 'item' },
        animation: { enter: { duration: 600 }, update: { duration: 420, easing: 'easeOutCubic' } },
        series: [{ id: 'st', type: 'funnel', name: '环节', data: stageData, minSize: 0.18, gap: 2, label: { position: 'inside' } }],
      });

      const pack = ICEChart.createChart('pack', {
        ...BASE,
        tooltip: { trigger: 'item' },
        liquid: { min: 0, max: 100, color: IDENTITY.accent, borderWidth: 4, waveHeight: 0.05, waveLength: 1.4, waveSpeed: 1.6, unit: '%', detail: { fontSize: 30 } },
        series: [{ id: 'pk', type: 'liquid', name: '装载率', data: [{ name: '在途', value: 0 }] }],
      });

      const warehouseTree = [
        { name: '华东仓', children: [{ name: 'A 区', value: 420 }, { name: 'B 区', value: 300 }] },
        { name: '华南仓', children: [{ name: 'A 区', value: 260 }, { name: 'B 区', value: 180 }] },
        { name: '临时周转', value: 120 },
      ];
      const warehouse = ICEChart.createChart('warehouse', {
        ...BASE,
        tooltip: { trigger: 'item' },
        animation: { enter: { duration: 600 }, update: { duration: 520, easing: 'easeOutCubic' } },
        treemap: { gap: 2, minLabelRatio: 0.05, depthFade: 0.16 },
        series: [{ id: 'wh', type: 'treemap', name: '库容', data: warehouseTree }],
      });

      const costBase = [
        { name: '面单', value: 168 },
        { name: '揽收', value: -92 },
        { name: '干线', value: -146 },
        { name: '派送', value: -128 },
        { name: '售后', value: -24 },
      ];
      const cost = ICEChart.createChart('cost', {
        ...BASE,
        tooltip: { trigger: 'item' },
        xAxis: { type: 'category' },
        yAxis: { name: '元', min: -500, max: 240 },
        animation: { enter: { duration: 600 }, update: { duration: 420, easing: 'easeOutCubic' } },
        series: [{ id: 'c', type: 'waterfall', name: '成本', barWidth: 0.55, data: costBase.concat([{ name: '单票毛利', value: 0, total: true }]) }],
      });

      const network = ICEChart.createChart('network', {
        ...BASE,
        tooltip: { trigger: 'item' },
        graph: {
          // 宽而矮的面板（498×170）：节点调小、斥力加大、重力调小，否则 7 个节点会挤成一团
          symbolSizeRange: [7, 16],
          repulsion: 16000,
          edgeLength: 86,
          gravity: 0.02,
          categories: [
            { name: '仓', color: IDENTITY.accent },
            { name: '站', color: '#fac858' },
            { name: '末端', color: '#2ee6c5' },
          ],
          nodes: [
            { id: 'w1', name: '华东仓', value: 15, category: '仓' },
            { id: 'w2', name: '华南仓', value: 12, category: '仓' },
            { id: 's1', name: '城区站', value: 11, category: '站' },
            { id: 's2', name: '郊区站', value: 9, category: '站' },
            { id: 'e1', name: '驿站', value: 10, category: '末端' },
            { id: 'e2', name: '快递柜', value: 8, category: '末端' },
            { id: 'e3', name: '上门', value: 7, category: '末端' },
          ],
          links: [
            { source: 'w1', target: 's1', value: 6 },
            { source: 'w1', target: 's2', value: 4 },
            { source: 'w2', target: 's2', value: 4 },
            { source: 's1', target: 'e1', value: 5 },
            { source: 's1', target: 'e2', value: 3 },
            { source: 's2', target: 'e3', value: 4 },
          ],
        },
        series: [{ id: 'net', type: 'graph', name: '网络' }],
      });

      const parcel = ICEChart.createChart('parcel', {
        ...BASE,
        tooltip: { trigger: 'item' },
        sankey: {
          nodes: [
            { name: '华东仓' },
            { name: '华南仓' },
            { name: '干线' },
            { name: '城区站' },
            { name: '郊区站' },
            { name: '签收' },
            { name: '退回' },
          ],
          links: [
            { source: '华东仓', target: '干线', value: 820 },
            { source: '华南仓', target: '干线', value: 560 },
            { source: '干线', target: '城区站', value: 780 },
            { source: '干线', target: '郊区站', value: 540 },
            { source: '干线', target: '退回', value: 60 },
            { source: '城区站', target: '签收', value: 726 },
            { source: '城区站', target: '退回', value: 54 },
            { source: '郊区站', target: '签收', value: 498 },
            { source: '郊区站', target: '退回', value: 42 },
          ],
          nodeWidth: 12,
          nodePadding: 8,
          flow: true,
          flowSpeed: 46,
          linkOpacity: 0.62,
        },
        series: [{ id: 'pf', type: 'sankey', name: '流向' }],
      });

      const spreadSamples = () => {
        const base = [26, 31, 38, 47, 63];
        return base.map((v, i) => Array.from({ length: 24 }, () => Number(clamp(v + (state.hours - 6.4) * 6 + (Math.random() - 0.5) * (6 + i * 2), 8, 140).toFixed(1))));
      };
      const spread = ICEChart.createChart('spread', {
        ...BASE,
        tooltip: { trigger: 'item' },
        xAxis: { type: 'category', data: ['华东', '华南', '华北', '西南', '东北'] },
        yAxis: { name: '小时', min: 8, max: 140 },
        animation: { enter: { duration: 600 }, update: { duration: 400, easing: 'easeOutCubic' } },
        series: [{ id: 'sp', type: 'boxplot', name: '时效', data: spreadSamples() }],
      });

      const carrierRows = [
        { name: '承运 A', value: 98.2 },
        { name: '承运 B', value: 96.1 },
        { name: '承运 C', value: 93.4 },
        { name: '承运 D', value: 89.6 },
        { name: '承运 E', value: 85.2 },
      ];
      const carrierColor = (v) => (v >= 96 ? '#22c55e' : v >= 92 ? IDENTITY.accent : v >= 88 ? '#fac858' : '#ff5b6a');
      // 类目轴第 0 项在最下面：按准时率升序排，最好的承运商排到最上面
      const carrierSorted = (rows) => rows.slice().sort((a, b) => a.value - b.value);
      const carrierOption = () => ({
        ...BASE,
        tooltip: { trigger: 'item' },
        xAxis: { type: 'value', name: '准时率 %', min: 80, max: 100 },
        yAxis: { type: 'category', data: carrierSorted(carrierRows).map((r) => r.name) },
        grid: { x: true, y: false },
        series: [
          { id: 'ca', type: 'bar', name: '准时率', barWidth: 0.5, data: carrierSorted(carrierRows).map((r) => ({ name: r.name, value: r.value, color: carrierColor(r.value) })) },
        ],
      });
      const carrier = ICEChart.createChart('carrier', carrierOption());

      const HOURS = ['08', '10', '12', '14', '16', '18', '20', '22'];
      const hourlyValues = HOURS.map(() => 900);
      const hourlyLimit = 1400;
      const hourly = ICEChart.createChart('hourly', {
        ...BASE,
        tooltip: { trigger: 'item' },
        xAxis: { type: 'category', data: HOURS.map((h) => `${h}:00`) },
        yAxis: { name: '单', min: 0, max: 1800 },
        animation: { enter: { duration: 600 }, update: { duration: 320, easing: 'easeOutCubic' } },
        series: [
          {
            id: 'h',
            type: 'bar',
            name: '揽收',
            barWidth: 0.55,
            data: hourlyValues.map((v) => ({ value: Math.round(v), color: v > hourlyLimit ? '#ff5b6a' : v > hourlyLimit * 0.85 ? '#fac858' : IDENTITY.accent })),
          },
          { id: 'lim', type: 'line', name: '产能上限', data: HOURS.map(() => hourlyLimit), color: '#6b4034', lineWidth: 1.5, smooth: 0, symbol: { show: false } },
        ],
      });

      const exceptions = [];
      const exceptionChart = ICEChart.createChart('exception', {
        ...BASE,
        tooltip: { trigger: 'item' },
        xAxis: { type: 'value', name: '时间' },
        yAxis: { name: '件', min: 0, max: 70 },
        series: [
          { id: 'ex', type: 'scatter', name: '破损', data: [], symbolSize: 8, color: '#f472b6' },
          { id: 'ex2', type: 'scatter', name: '延误', data: [], symbolSize: 8, color: '#fac858' },
        ],
      });

      // ---------------- 主循环 ----------------
      const updateKpi = DashKit.kpiUpdater();

      const loop = DashKit.loop({
        tick: () => {
          state.t += 1;
          const t = state.t;
          if (state.backlog > 0) state.backlog -= 1;
          else if (Math.random() < 0.002) state.backlog = 70;
          const boost = state.backlog > 0 ? 1 : 0;

          const wave = Math.sin(t / 200) * 420 + Math.sin(t / 70) * 120;
          state.orders = clamp(DashKit.walk(state.orders, 860 + wave + boost * 700, 16), 200, 1800);
          state.hours = clamp(DashKit.walk(state.hours, 6.4 + boost * 2.6 + Math.abs(wave) / 900, 0.05), 2, 24);
          state.ontime = clamp(DashKit.walk(state.ontime, 96.5 - boost * 6, 0.12), 70, 100);
          state.exception = clamp(DashKit.walk(state.exception, 42 + boost * 26, 0.8), 0, 200);
          state.pack = clamp(DashKit.walk(state.pack, 62 + wave / 30, 0.5), 10, 100);

          orders.appendData('o', [[t, Math.round(state.orders)]], { maxPoints: WINDOW });
          orders.appendData('d', [[t, Math.round(state.orders * 0.94)]], { maxPoints: WINDOW });
          sla.appendData('s', [[t, Number((state.hours * 6 + Math.sin(t / 60) * 4).toFixed(1))]], { maxPoints: WINDOW });

          if (t % 12 === 0) pack.setData('pk', [{ name: '在途', value: Number(state.pack.toFixed(1)) }]);
          if (t % 40 === 0) {
            stage.setData(
              'st',
              stageData.map((d) => ({ ...d, value: Math.round(d.value * (0.94 + Math.random() * 0.12)) }))
            );
            warehouse.setData(
              'wh',
              warehouseTree.map((node) => (node.children
                ? { ...node, children: node.children.map((c) => ({ ...c, value: Math.round(c.value * (0.8 + Math.random() * 0.4)) })) }
                : { ...node, value: Math.round(node.value * (0.8 + Math.random() * 0.4)) }))
            );
            cost.setData(
              'c',
              costBase.map((d) => ({ ...d, value: Math.round(d.value * (0.9 + Math.random() * 0.2)) })).concat([{ name: '单票毛利', value: 0, total: true }])
            );
            spread.setData('sp', spreadSamples());
          }
          if (t % 60 === 0) {
            carrierRows.forEach((r) => (r.value = Number(clamp(r.value + (Math.random() - 0.5) * 3, 80, 100).toFixed(1))));
            carrier.setOption(carrierOption());
          }
          if (t % 20 === 0) {
            const hour = new Date().getHours();
            hourlyValues[hour % HOURS.length] = state.orders * 0.9;
            hourly.setData(
              'h',
              hourlyValues.map((v) => ({ value: Math.round(v), color: v > hourlyLimit ? '#ff5b6a' : v > hourlyLimit * 0.85 ? '#fac858' : IDENTITY.accent }))
            );
          }
          if (Math.random() < (boost ? 0.4 : 0.08)) {
            exceptions.push({ t, v: clamp(6 + Math.random() * 40 + boost * 14, 0, 60), kind: Math.random() < 0.5 ? 'ex' : 'ex2' });
            if (exceptions.length > 60) exceptions.shift();
            exceptionChart.setData('ex', exceptions.filter((e) => e.kind === 'ex').map((e) => [e.t, Math.round(e.v)]));
            exceptionChart.setData('ex2', exceptions.filter((e) => e.kind === 'ex2').map((e) => [e.t, Math.round(e.v)]));
          }

          const alerting = state.backlog > 40;
          $('pill-alert').textContent = `积压 ${Math.round(state.backlog)}`;
          $('pill-alert').className = `dk-pill ${alerting ? 'danger' : 'ok'}`;
          $('pill-ontime').textContent = `${state.ontime.toFixed(1)}%`;
          ['orders', 'sla', 'stage'].forEach((id) => {
            const panel = $('panel-' + id);
            if (panel) panel.classList.toggle('dk-alert', alerting);
          });

          updateKpi('kpi-orders', state.orders, `${(state.orders * 8.6).toFixed(0)}<small>单</small>`);
          updateKpi('kpi-transit', state.pack, `${(state.pack * 128).toFixed(0)}<small>件</small>`);
          updateKpi('kpi-ontime', state.ontime, `${state.ontime.toFixed(1)}<small>%</small>`);
          updateKpi('kpi-exception', state.exception, `${Math.round(state.exception)}<small>件</small>`, true);
          updateKpi('kpi-hours', state.hours, `${state.hours.toFixed(1)}<small>h</small>`, true);
        },
        onFrame: () => {
          $('pill-clock').textContent = new Date().toLocaleTimeString('zh-CN', { hour12: false });
        },
      });

      $('btn-toggle').addEventListener('click', (event) => {
        event.target.textContent = loop.toggle() ? '暂停' : '继续';
      });
      $('btn-spike').addEventListener('click', () => {
        state.backlog = 70;
      });

      DashKit.wire({
        main: orders,
        link,
        charts: { orders, sla, stage, pack, warehouse, cost, network, parcel, spread, carrier, hourly, exception: exceptionChart },
      });
    </script>
  </body>
</html>
