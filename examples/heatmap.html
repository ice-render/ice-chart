<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>ice-chart · 热力图</title>
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <h1>热力图</h1>
    <p class="lead">
      数据项是 <code>[x类目, y类目, 数值]</code>，<b>y 轴自动变成类目轴</b>，颜色按数值线性插值；
      命中判定按单元格矩形，提示框给出类目对与数值。
    </p>
    <div class="row">
      <div class="card"><canvas id="heatmap" width="760" height="420"></canvas></div>
    </div>
    <div class="card" id="snapshot-panel"></div>
    <div class="card"><div class="log" id="log">事件日志：</div></div>
    <script src="./vendor/ice-render.umd.js"></script>
    <script src="./vendor/ice-chart.umd.js"></script>
    <script src="./assets/snapshot-panel.js"></script>
    <script>
      // ---- 热力图：一周 × 六个时段
      const weekdays = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
      const slots = ['凌晨', '上午', '中午', '下午', '傍晚', '深夜'];
      const heat = [];
      for (const day of weekdays) {
        for (const slot of slots) {
          const base = slot === '中午' || slot === '下午' ? 60 : 25;
          const weekend = day === '周六' || day === '周日' ? 18 : 0;
          heat.push([day, slot, Math.round(base + weekend + Math.random() * 30)]);
        }
      }

      const heatmap = ICEChart.createChart('heatmap', {
        title: { text: '一周活跃度热力图' },
        theme: 'light',
        legend: { show: false },
        tooltip: { trigger: 'item' },
        xAxis: { type: 'category' },
        yAxis: { type: 'category' },
        series: [
          {
            id: 'heat',
            type: 'heatmap',
            name: '活跃度',
            data: heat,
            color: '#1D4ED8',
            heatmap: { minColor: '#EFF6FF', maxColor: '#1D4ED8' },
          },
        ],
      });

      const log = document.getElementById('log');
      const write = (line) => {
        log.textContent = `${new Date().toLocaleTimeString()}  ${line}\n` + log.textContent;
      };
      heatmap.on('item:hover', (p) => write(`热力图 ${p.data[0]} · ${p.data[1]} = ${p.data[2]}`));
      window.__charts = { heatmap };
      mountSnapshotPanel();
    </script>
  </body>
</html>
